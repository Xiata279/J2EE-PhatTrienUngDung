<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
</head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5 mb-4" style="background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); border-radius: 16px;">
        <h1 class="fw-bold mb-2" style="color:#0f172a;">Chào mừng đến <span style="color:#0284c7;">Ma Đạo Store</span></h1>
        <p class="text-muted mb-4" style="max-width:520px; margin: 0 auto;">Hệ thống quản lý sản phẩm hiện đại, đơn giản và hiệu quả.</p>
        <a th:href="@{/shop}" class="btn btn-sky btn-lg px-4">
            <i class="fas fa-store me-2"></i>Khám phá cửa hàng
        </a>
    </div>

    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0" style="color:#0f172a;"><i class="fas fa-fire me-2" style="color:#0284c7;"></i>Sản phẩm nổi bật</h5>
            <a th:href="@{/shop}" class="text-decoration-none" style="color:#0284c7; font-size:0.9rem;">
                Xem tất cả <i class="fas fa-arrow-right ms-1"></i>
            </a>
        </div>
        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3" th:each="product : ${featuredProducts}">
                <div class="card h-100">
                    <div style="height:180px; background:#f0f9ff; border-radius:12px 12px 0 0; overflow:hidden;"
                         class="d-flex align-items-center justify-content-center">
                        <img th:if="${product.image != null and !product.image.isEmpty()}"
                             th:src="@{'/images/' + ${product.image}}"
                             style="width:100%; height:100%; object-fit:cover;" alt=""/>
                        <i th:unless="${product.image != null and !product.image.isEmpty()}"
                           class="fas fa-image fa-3x" style="color:#cbd5e1;"></i>
                    </div>
                    <div class="card-body p-3">
                        <span th:if="${product.category != null}"
                              class="badge mb-2"
                              style="background:#e0f2fe; color:#0284c7; font-weight:500; font-size:0.75rem;"
                              th:text="${product.category.name}"></span>
                        <h6 class="fw-semibold mb-1" style="font-size:0.92rem;" th:text="${product.name}"></h6>
                        <p class="fw-bold mb-0" style="color:#0284c7;"
                           th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' đ'"></p>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(featuredProducts)}" class="col-12">
                <div class="text-center text-muted py-5">
                    <i class="fas fa-box-open fa-3x mb-3 d-block" style="color:#cbd5e1;"></i>
                    <p>Chưa có sản phẩm nào.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body p-4">
            <h6 class="fw-semibold mb-3"><i class="fas fa-info-circle me-2" style="color:#0284c7;"></i>Thông tin đồ án</h6>
            <table class="table table-borderless mb-0" style="font-size:0.9rem;">
                <tr><td class="text-muted" style="width:150px;">Họ tên:</td><td class="fw-semibold">Nguyễn Thành Luân</td></tr>
                <tr><td class="text-muted">MSSV:</td><td class="fw-semibold">2280601855</td></tr>
                <tr><td class="text-muted">Môn học:</td><td class="fw-semibold">Phát triển ứng dụng với J2EE</td></tr>
                <tr><td class="text-muted">Đề tài:</td><td class="fw-semibold">Quản lý sản phẩm (Spring Boot + MySQL)</td></tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>

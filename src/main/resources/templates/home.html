<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h4 class="fw-bold text-dark mb-1">Trang chủ</h4>
        <p class="text-muted mb-0">Chào mừng đến với hệ thống quản lý sản phẩm</p>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-3 p-3" style="background:#e8f0fe;">
                        <i class="fas fa-shopping-bag fa-lg" style="color:#1967d2;"></i>
                    </div>
                    <div>
                        <div class="text-muted" style="font-size:0.8rem;">Sản phẩm</div>
                        <div class="fw-bold fs-5">Quản lý SP</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div class="rounded-3 p-3" style="background:#fce8e6;">
                        <i class="fas fa-tags fa-lg" style="color:#c5221f;"></i>
                    </div>
                    <div>
                        <div class="text-muted" style="font-size:0.8rem;">Danh mục</div>
                        <div class="fw-bold fs-5">Quản lý DM</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <h6 class="fw-semibold mb-3"><i class="fas fa-info-circle me-2 text-primary"></i>Thông tin đồ án</h6>
            <table class="table table-borderless mb-0" style="font-size:0.9rem;">
                <tr><td class="text-muted" style="width:150px;">Họ tên:</td><td class="fw-semibold">Nguyễn Gia Huy</td></tr>
                <tr><td class="text-muted">MSSV:</td><td class="fw-semibold">1178</td></tr>
                <tr><td class="text-muted">Môn học:</td><td class="fw-semibold">Phát triển ứng dụng với J2EE</td></tr>
                <tr><td class="text-muted">Đề tài:</td><td class="fw-semibold">Quản lý sản phẩm (Spring Boot + MySQL)</td></tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>

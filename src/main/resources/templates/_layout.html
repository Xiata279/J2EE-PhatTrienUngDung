<!DOCTYPE html>
<html lang="vi" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ma Đạo Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --green: #16a34a;
            --green-dark: #15803d;
            --green-light: #dcfce7;
            --green-hover-bg: #f0fdf4;
        }

        body {
            background: #f8fafc;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        .navbar {
            background: #fff;
            border-bottom: 2px solid var(--green-light);
            box-shadow: 0 1px 6px rgba(22,163,74,0.07);
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--green-dark) !important;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }

        .navbar-brand i {
            color: var(--green);
        }

        .navbar .nav-link {
            color: #374151 !important;
            font-weight: 500;
            font-size: 0.92rem;
            padding: 8px 14px !important;
            border-radius: 8px;
            transition: all 0.18s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: var(--green-dark) !important;
            background: var(--green-hover-bg);
        }

        .btn-green {
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.18s;
        }

        .btn-green:hover {
            background: var(--green-dark);
            color: #fff;
        }

        .btn-outline-green {
            border: 1.5px solid var(--green);
            color: var(--green);
            background: transparent;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.18s;
        }

        .btn-outline-green:hover {
            background: var(--green);
            color: #fff;
        }

        /* Override Bootstrap btn-outline-primary & btn-primary to green */
        .btn-primary {
            background-color: var(--green) !important;
            border-color: var(--green) !important;
        }
        .btn-primary:hover {
            background-color: var(--green-dark) !important;
            border-color: var(--green-dark) !important;
        }
        .btn-outline-primary {
            color: var(--green) !important;
            border-color: var(--green) !important;
        }
        .btn-outline-primary:hover {
            background-color: var(--green) !important;
            color: #fff !important;
        }
        .btn-success {
            background-color: var(--green-dark) !important;
            border-color: var(--green-dark) !important;
        }

        /* Override Bootstrap green sky classes from old code */
        .btn-sky { background: var(--green); color:#fff; border:none; border-radius:8px; }
        .btn-sky:hover { background: var(--green-dark); color:#fff; }
        .btn-outline-sky { border:1.5px solid var(--green); color:var(--green); background:transparent; border-radius:8px; }
        .btn-outline-sky:hover { background:var(--green); color:#fff; }

        .page-content {
            min-height: calc(100vh - 140px);
            padding: 32px 0;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .card:hover {
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.13);
            transform: translateY(-2px);
        }

        .site-footer {
            background: #fff;
            border-top: 2px solid var(--green-light);
            padding: 20px 0;
        }

        .site-footer p {
            color: #6b7280;
            font-size: 0.85rem;
            margin: 0;
        }

        .table thead th {
            background: #f0fdf4;
            font-weight: 600;
            font-size: 0.87rem;
            color: #166534;
        }

        .table tbody tr:hover {
            background: #f0fdf4;
        }

        .btn-sm {
            font-size: 0.8rem;
        }

        /* Badge overrides */
        .badge.bg-warning { background-color: #fbbf24 !important; }
        .badge.bg-success { background-color: var(--green) !important; }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fas fa-dragon"></i>Ma Đạo Store
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto ms-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="fas fa-home me-1"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shop}"><i class="fas fa-store me-1"></i> Cửa hàng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cart}"><i class="fas fa-shopping-cart me-1"></i> Giỏ hàng</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-outline-sky btn-sm px-3">
                            <i class="fas fa-sign-in-alt me-1"></i> Đăng nhập
                        </a>
                        <a th:href="@{/register}" class="btn btn-sky btn-sm px-3 ms-1">
                            <i class="fas fa-user-plus me-1"></i> Đăng ký
                        </a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-outline-sky btn-sm dropdown-toggle px-3" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span sec:authentication="name"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" th:href="@{/admin/products}">
                                    <i class="fas fa-cog me-2 text-muted"></i>Quản trị hệ thống
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <hr class="dropdown-divider" />
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/cart/orders}">
                                    <i class="fas fa-clipboard-list me-2 text-muted"></i>Đơn hàng của tôi
                                </a>
                            </li>
                            <li><hr class="dropdown-divider" /></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div layout:fragment="content"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container text-center">
            <p>&copy; 2026 Ma Đạo Store &nbsp;|&nbsp; Phát triển ứng dụng với J2EE</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

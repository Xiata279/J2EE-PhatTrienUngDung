<!DOCTYPE html>
<html lang="vi" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Quản Lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f0f2f5; }

        /* Sidebar */
        #sidebar {
            width: 240px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1e3a5f 0%, #2d5986 100%);
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
        }
        #sidebar .sidebar-brand {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        #sidebar .sidebar-brand h5 {
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            margin: 0;
        }
        #sidebar .sidebar-brand small {
            color: rgba(255,255,255,0.6);
            font-size: 0.75rem;
        }
        #sidebar .nav-link {
            color: rgba(255,255,255,0.75);
            padding: 10px 20px;
            border-radius: 6px;
            margin: 2px 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
        }
        #sidebar .nav-link i { width: 20px; }

        /* Main content */
        #main-content {
            margin-left: 240px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            background: #fff;
            padding: 12px 24px;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        /* Page content */
        .page-content { padding: 24px; flex: 1; }

        /* Footer */
        footer {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 12px 24px;
            font-size: 0.82rem;
            color: #888;
            text-align: center;
        }

        /* Cards */
        .card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-header {
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
        }

        /* Table */
        .table thead th { background-color: #f8f9fa; font-weight: 600; font-size: 0.87rem; }
        .table tbody tr:hover { background-color: #f5f8ff; }

        /* Buttons */
        .btn-sm { font-size: 0.8rem; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
    <div class="sidebar-brand">
        <h5><i class="fas fa-box-open me-2"></i>Quản Lý Sản Phẩm</h5>
        <small>Nguyễn Thành Luân 2280601855</small>
    </div>
    <ul class="nav flex-column mt-2">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/}">
                <i class="fas fa-home me-2"></i>Trang chủ
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/products}">
                <i class="fas fa-shopping-bag me-2"></i>Sản phẩm
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/categories}">
                <i class="fas fa-tags me-2"></i>Danh mục
            </a>
        </li>
    </ul>
</div>

<!-- Main content -->
<div id="main-content">
    <!-- Topbar -->
    <div class="topbar d-flex justify-content-between align-items-center">
        <span class="fw-semibold text-secondary" style="font-size:0.9rem;">
            <i class="fas fa-layer-group me-1 text-primary"></i> Hệ thống quản lý sản phẩm
        </span>
        <span class="text-muted" style="font-size:0.85rem;">
            <i class="fas fa-user-circle me-1"></i> Nguyễn Thành Luân
        </span>
    </div>

    <!-- Page content -->
    <div class="page-content">
        <div layout:fragment="content"></div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 &nbsp;|&nbsp; Nguyễn Thành Luân - MSSV: 2280601855 &nbsp;|&nbsp;
        Môn: Phát triển ứng dụng với J2EE
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

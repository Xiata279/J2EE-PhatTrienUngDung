<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head><title>Giỏ hàng</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h4 class="fw-bold mb-1" style="color:#0f172a;">Giỏ hàng của bạn</h4>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        Đặt hàng thành công! Bạn có thể xem đơn hàng tại <a th:href="@{/cart/orders}">Lịch sử đơn hàng</a>.
    </div>

    <div class="row">
        <div th:class="${#lists.isEmpty(cartItems)} ? 'col-12' : 'col-md-8'">
            <!-- Khi giỏ hàng có sản phẩm -->
            <div th:if="${not #lists.isEmpty(cartItems)}">
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Tên sản phẩm</th>
                                <th>Đơn giá</th>
                                <th style="width:120px;">Số lượng</th>
                                <th>Thành tiền</th>
                                <th style="width:80px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td class="text-start" th:text="${item.name}"></td>
                                <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + ' đ'"></td>
                                <td>
                                    <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center justify-content-center gap-1">
                                        <input type="hidden" name="productId" th:value="${item.productId}">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="99" class="form-control form-control-sm text-center" style="width:60px;">
                                        <button type="submit" class="btn btn-sm btn-outline-primary" title="Cập nhật">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </form>
                                </td>
                                <td class="fw-semibold" th:text="${#numbers.formatInteger(item.price * item.quantity, 0, 'COMMA')} + ' đ'"></td>
                                <td>
                                    <a th:href="@{/cart/remove/{id}(id=${item.productId})}" class="btn btn-sm btn-outline-danger" title="Xóa"
                                       onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?');">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4" class="text-end fw-bold">Tổng tiền:</td>
                                <td class="fw-bold text-danger fs-5" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + ' đ'"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/shop}" class="btn btn-outline-primary">Tiếp tục mua sắm</a>
                    <a th:href="@{/cart/orders}" class="btn btn-outline-secondary">Lịch sử đơn hàng</a>
                </div>
            </div>
            
            <!-- Khi giỏ hàng trống -->
            <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5 bg-white border rounded">
                <i class="fas fa-shopping-basket fa-3x mb-3" style="color:#cbd5e1;"></i>
                <p class="fs-5 text-muted">Giỏ hàng của bạn đang trống.</p>
                <div class="mt-3">
                    <a th:href="@{/shop}" class="btn btn-primary">Khám phá sản phẩm</a>
                    <a th:href="@{/cart/orders}" class="btn btn-outline-secondary ms-2">Lịch sử đơn hàng</a>
                </div>
            </div>
        </div>

        <div class="col-md-4" th:unless="${#lists.isEmpty(cartItems)}">
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold mb-3">Thông tin giao hàng</h5>
                <form th:action="@{/cart/checkout}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Họ Tên</label>
                        <input type="text" name="customerName" class="form-control" required placeholder="Nhập tên người nhận">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" name="phone" class="form-control" required placeholder="Nhập SĐT">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Địa chỉ</label>
                        <textarea name="address" class="form-control" rows="3" required placeholder="Nhập địa chỉ nhận hàng"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">Đặt hàng</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

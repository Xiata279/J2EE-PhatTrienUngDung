<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Trang chủ</title>
</head>
<body>
    <div layout:fragment="content">
        <h2>Chào mừng đến với ứng dụng quản lý sách!</h2>
        <p>Đây là trang chủ của ứng dụng. Sử dụng menu phía trên để điều hướng.</p>
        
        <div style="margin-top: 30px;">
            <h3>Chức năng chính:</h3>
            <ul>
                <li><strong>Danh sách sách:</strong> Xem tất cả các sách trong hệ thống</li>
                <li><strong>Thêm sách mới:</strong> Thêm sách mới vào cơ sở dữ liệu</li>
                <li><strong>Sửa/Xóa:</strong> Quản lý thông tin sách</li>
            </ul>
        </div>
    </div>
</body>
</html>

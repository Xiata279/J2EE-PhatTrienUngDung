<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head><title>Lịch sử đơn hàng</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h4 class="fw-bold mb-1" style="color:#0f172a;">Lịch sử đơn hàng</h4>
        <p class="text-muted mb-0">Theo dõi các đơn hàng bạn đã đặt</p>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="text-center text-muted py-5">
        <i class="fas fa-clipboard-list fa-3x mb-3 d-block" style="color:#cbd5e1;"></i>
        <p>Bạn chưa có đơn hàng nào.</p>
        <a th:href="@{/shop}" class="btn btn-primary">Mua sắm ngay</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light text-center">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Người nhận</th>
                        <th>SĐT</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}" class="text-center">
                        <td th:text="'#' + ${order.id}"></td>
                        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${order.customerName}"></td>
                        <td th:text="${order.phone}"></td>
                        <td class="fw-semibold text-danger" th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + ' đ'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${order.status == 'Chờ xác nhận'} ? 'bg-warning text-dark' : (${order.status == 'Đã hủy'} ? 'bg-secondary' : 'bg-success')"
                                  th:text="${order.status}"></span>
                        </td>
                        <td>
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/cart/orders/detail/{id}(id=${order.id})}" class="btn btn-sm btn-outline-info" title="Xem chi tiết">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <form th:if="${order.status == 'Chờ xác nhận'}" th:action="@{/cart/orders/cancel/{id}(id=${order.id})}" method="post"
                                      onsubmit="return confirm('Bạn có chắc muốn hủy đơn hàng này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Hủy đơn">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </form>
                                <span th:if="${order.status == 'Đã hủy'}" class="text-muted small d-flex align-items-center">Đã xóa</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/shop}" class="btn btn-outline-primary">Tiếp tục mua sắm</a>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold text-dark mb-1">Quản lý sản phẩm</h4>
            <p class="text-muted mb-0">Danh sách tất cả sản phẩm trong hệ thống</p>
        </div>
        <a th:href="@{/products/create}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i> Thêm sản phẩm
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width:50px;" class="ps-3">#</th>
                        <th>Sản phẩm</th>
                        <th style="width:140px;">Giá (VNĐ)</th>
                        <th style="width:150px;">Danh mục</th>
                        <th style="width:120px;" class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(listProduct)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="fas fa-box-open fa-2x mb-2 d-block"></i>
                            Chưa có sản phẩm nào.
                        </td>
                    </tr>
                    <tr th:each="product, stat : ${listProduct}">
                        <td class="ps-3 text-muted" th:text="${stat.count}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img th:if="${product.image != null and !product.image.isEmpty()}"
                                     th:src="@{'/images/' + ${product.image}}"
                                     style="width:44px;height:44px;object-fit:cover;border-radius:8px;"
                                     alt="Ảnh sản phẩm"/>
                                <div th:unless="${product.image != null and !product.image.isEmpty()}"
                                     style="width:44px;height:44px;background:#f0f2f5;border-radius:8px;"
                                     class="d-flex align-items-center justify-content-center">
                                    <i class="fas fa-image text-muted"></i>
                                </div>
                                <span class="fw-semibold" th:text="${product.name}"></span>
                            </div>
                        </td>
                        <td class="fw-semibold text-success" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' đ'"></td>
                        <td>
                            <span th:if="${product.category != null}" class="badge bg-primary-subtle text-primary" th:text="${product.category.name}"></span>
                            <span th:unless="${product.category != null}" class="badge bg-secondary-subtle text-secondary">Chưa phân loại</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{'/products/delete/' + ${product.id}}" class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_admin_layout}">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold text-dark mb-1">Chỉnh sửa sản phẩm</h4>
            <p class="text-muted mb-0">Cập nhật thông tin sản phẩm</p>
        </div>
        <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <i class="fas fa-edit me-2"></i>Cập nhật thông tin
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/products/edit}" th:object="${product}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm..."/>
                            <div class="text-danger mt-1" style="font-size:0.82rem;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Giá (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{price}" class="form-control" placeholder="Nhập giá sản phẩm..."/>
                            <div class="text-danger mt-1" style="font-size:0.82rem;" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Danh mục</label>
                            <select name="category.id" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${product.category != null and product.category.id == cat.id}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hình ảnh sản phẩm</label>
                            <div th:if="${product.image != null and !product.image.isEmpty()}" class="mb-2">
                                <img th:src="@{'/images/' + ${product.image}}" style="max-width:120px;max-height:120px;object-fit:cover;border-radius:8px;border:1px solid #dee2e6;" alt="Ảnh hiện tại"/>
                                <p class="text-muted mt-1 mb-0" style="font-size:0.8rem;">Ảnh hiện tại — để trống nếu không muốn thay đổi</p>
                            </div>
                            <input type="file" name="imageProduct" class="form-control" accept="image/png,image/jpeg,image/jpg" onchange="previewImage(event)"/>
                            <div class="mt-2" id="previewBox" style="display:none;">
                                <img id="preview" src="#" alt="Xem trước" style="max-width:120px;border-radius:8px;border:1px solid #dee2e6;"/>
                            </div>
                            <div class="text-danger mt-1" style="font-size:0.82rem;" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-warning px-4">
                                <i class="fas fa-save me-1"></i> Cập nhật
                            </button>
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('preview');
        const box = document.getElementById('previewBox');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; box.style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        } else {
            box.style.display = 'none';
        }
    }
</script>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Ma Đạo Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --green: #16a34a;
            --green-dark: #15803d;
            --green-light: #dcfce7;
        }

        body {
            background: #f1f5f9;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        #sidebar {
            width: 250px;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
            box-shadow: 2px 0 14px rgba(0,0,0,0.12);
        }

        #sidebar .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        #sidebar .sidebar-brand h5 {
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0;
        }

        #sidebar .sidebar-brand small {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.75rem;
        }

        #sidebar .nav-link {
            color: rgba(255, 255, 255, 0.82);
            padding: 11px 20px;
            margin: 2px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        #sidebar .nav-link:hover,
        #sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        #sidebar .nav-link i {
            width: 22px;
            text-align: center;
        }

        .sidebar-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin: 12px 20px;
        }

        #main-content {
            margin-left: 250px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #fff;
            padding: 14px 28px;
            border-bottom: 2px solid var(--green-light);
            box-shadow: 0 1px 4px rgba(22,163,74,0.06);
        }

        .page-content {
            padding: 28px;
            flex: 1;
        }

        footer {
            background: #fff;
            border-top: 2px solid var(--green-light);
            padding: 14px 28px;
            font-size: 0.82rem;
            color: #6b7280;
            text-align: center;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            border-radius: 14px 14px 0 0 !important;
            font-weight: 600;
        }

        .table thead th {
            background: #f0fdf4;
            font-weight: 600;
            font-size: 0.87rem;
            color: #166534;
        }

        .table tbody tr:hover {
            background: #f0fdf4;
        }

        /* Override Bootstrap buttons to green in admin too */
        .btn-primary { background-color: var(--green) !important; border-color: var(--green) !important; }
        .btn-primary:hover { background-color: var(--green-dark) !important; border-color: var(--green-dark) !important; }
        .btn-outline-primary { color: var(--green) !important; border-color: var(--green) !important; }
        .btn-outline-primary:hover { background-color: var(--green) !important; color:#fff !important; }
        .btn-success { background-color: var(--green-dark) !important; border-color: var(--green-dark) !important; }

        .btn-sky { background: var(--green); color:#fff; border:none; border-radius:8px; }
        .btn-sky:hover { background: var(--green-dark); color:#fff; }

        .btn-sm { font-size: 0.8rem; }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="sidebar-brand">
            <h5><i class="fas fa-dragon me-2"></i>Ma Đạo Store</h5>
            <small>Bảng điều khiển quản trị</small>
        </div>
        <ul class="nav flex-column mt-2">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/products}">
                    <i class="fas fa-box me-2"></i>Sản phẩm
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/categories}">
                    <i class="fas fa-layer-group me-2"></i>Danh mục
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/orders}">
                    <i class="fas fa-clipboard-list me-2"></i>Quản lý đơn hàng
                </a>
            </li>
            <div class="sidebar-divider"></div>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}">
                    <i class="fas fa-arrow-left me-2"></i>Về trang chủ
                </a>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link w-100 text-start border-0 bg-transparent">
                        <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                    </button>
                </form>
            </li>
        </ul>
    </div>

    <div id="main-content">
        <div class="topbar d-flex justify-content-between align-items-center">
            <span class="fw-semibold text-secondary" style="font-size:0.9rem;">
                <i class="fas fa-shield-halved me-1" style="color:var(--green);"></i> Khu vực quản trị
            </span>
            <span class="text-muted" style="font-size:0.85rem;">
                <i class="fas fa-user-circle me-1"></i>
                <span sec:authentication="name">Admin</span>
            </span>
        </div>
        <div class="page-content">
            <div layout:fragment="content"></div>
        </div>
        <footer>
            &copy; 2026 Ma Đạo Store &nbsp;|&nbsp; Phát triển ứng dụng với J2EE
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

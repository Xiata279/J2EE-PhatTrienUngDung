<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_admin_layout}">
<head><title>Quản lý đơn hàng - Admin</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h5 class="fw-bold mb-1" style="color:#166534;">Quản lý đơn hàng</h5>
            <p class="text-muted mb-0" style="font-size:0.88rem;">Danh sách toàn bộ đơn hàng của khách</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5 text-muted">
                <i class="fas fa-clipboard-list fa-2x mb-2 d-block" style="color:#bbf7d0;"></i>
                <p>Chưa có đơn hàng nào.</p>
            </div>
            <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                    <thead class="text-center">
                        <tr>
                            <th>#</th>
                            <th>Ngày đặt</th>
                            <th>Khách hàng</th>
                            <th>SĐT</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th style="width:220px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}" class="text-center">
                            <td th:text="'#' + ${order.id}"></td>
                            <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-start" th:text="${order.customerName}"></td>
                            <td th:text="${order.phone}"></td>
                            <td class="fw-semibold text-danger"
                                th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + ' đ'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${order.status == 'Chờ xác nhận'} ? 'bg-warning text-dark' :
                                                     (${order.status == 'Đang giao'} ? 'bg-info text-dark' :
                                                     (${order.status == 'Hoàn thành'} ? 'bg-success' : 'bg-secondary'))"
                                      th:text="${order.status}"></span>
                            </td>
                            <td>
                                <div class="d-flex justify-content-center align-items-center gap-1 flex-wrap">
                                    <!-- Xem chi tiết đơn hàng -->
                                    <a th:href="@{/cart/orders/detail/{id}(id=${order.id})}"
                                       class="btn btn-sm btn-outline-secondary" title="Xem chi tiết">
                                        <i class="fas fa-eye"></i>
                                    </a>

                                    <!-- Form đổi trạng thái -->
                                    <form th:action="@{/admin/orders/update-status/{id}(id=${order.id})}" method="post"
                                          class="d-flex gap-1 align-items-center">
                                        <select name="status" class="form-select form-select-sm" style="width:130px;">
                                            <option th:value="'Chờ xác nhận'" th:selected="${order.status == 'Chờ xác nhận'}">Chờ xác nhận</option>
                                            <option th:value="'Đang giao'" th:selected="${order.status == 'Đang giao'}">Đang giao</option>
                                            <option th:value="'Hoàn thành'" th:selected="${order.status == 'Hoàn thành'}">Hoàn thành</option>
                                            <option th:value="'Đã hủy'" th:selected="${order.status == 'Đã hủy'}">Đã hủy</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-success" title="Cập nhật">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </form>

                                    <!-- Xóa đơn hàng -->
                                    <form th:action="@{/admin/orders/delete/{id}(id=${order.id})}" method="post"
                                          onsubmit="return confirm('Xác nhận xóa đơn hàng #' + [[${order.id}]] + '?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa đơn">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>

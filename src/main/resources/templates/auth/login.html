<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fff 100%);
            min-height: 100vh; display: flex; align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            max-width: 420px; width: 100%; margin: 0 auto;
            border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .btn-sky { background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; }
        .btn-sky:hover { background: #0369a1; color: #fff; }
        a { color: #0284c7; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-cube fa-2x mb-2" style="color:#0284c7;"></i>
                <h4 class="fw-bold">Đăng nhập</h4>
                <p class="text-muted" style="font-size:0.9rem;">Chào mừng bạn trở lại Women Store</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2" style="font-size:0.88rem;">
                <i class="fas fa-exclamation-circle me-1"></i> Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2" style="font-size:0.88rem;">
                <i class="fas fa-check-circle me-1"></i> Đã đăng xuất thành công.
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2" style="font-size:0.88rem;">
                <i class="fas fa-check-circle me-1"></i> Đăng ký thành công! Vui lòng đăng nhập.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập..." required autofocus/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-sky w-100 py-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                </button>
            </form>

            <div class="text-center mt-3" style="font-size:0.9rem;">
                Chưa có tài khoản? <a th:href="@{/register}" class="fw-semibold">Đăng ký ngay</a>
            </div>
            <div class="text-center mt-2">
                <a th:href="@{/}" style="font-size:0.85rem; color:#64748b;">
                    <i class="fas fa-arrow-left me-1"></i> Về trang chủ
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>

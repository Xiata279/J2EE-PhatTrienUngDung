<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fff 100%);
            min-height: 100vh; display: flex; align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .register-card {
            max-width: 460px; width: 100%; margin: 0 auto;
            border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .btn-sky { background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; }
        .btn-sky:hover { background: #0369a1; color: #fff; }
        a { color: #0284c7; }
        .error-msg { color: #dc3545; font-size: 0.82rem; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="register-card card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-cube fa-2x mb-2" style="color:#0284c7;"></i>
                <h4 class="fw-bold">Tạo tài khoản</h4>
                <p class="text-muted" style="font-size:0.9rem;">Đăng ký tài khoản ShopManager</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2" style="font-size:0.88rem;">
                <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post" id="registerForm" novalidate="novalidate">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Tên đăng nhập <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" id="username" class="form-control"
                               placeholder="Nhập tên đăng nhập..." th:value="${username}" required="required" minlength="3"/>
                    </div>
                    <div class="error-msg" id="usernameError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Email <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" name="email" id="email" class="form-control"
                               placeholder="Nhập email..." th:value="${email}" required="required"/>
                    </div>
                    <div class="error-msg" id="emailError"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)..." required="required" minlength="6"/>
                    </div>
                    <div class="error-msg" id="passwordError"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size:0.9rem;">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                               placeholder="Nhập lại mật khẩu..." required="required"/>
                    </div>
                    <div class="error-msg" id="confirmError"></div>
                </div>
                <button type="submit" class="btn btn-sky w-100 py-2">
                    <i class="fas fa-user-plus me-2"></i>Đăng ký
                </button>
            </form>

            <div class="text-center mt-3" style="font-size:0.9rem;">
                Đã có tài khoản? <a th:href="@{/login}" class="fw-semibold">Đăng nhập</a>
            </div>
            <div class="text-center mt-2">
                <a th:href="@{/}" style="font-size:0.85rem; color:#64748b;">
                    <i class="fas fa-arrow-left me-1"></i> Về trang chủ
                </a>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    var valid = true;
    var username = document.getElementById('username');
    var email = document.getElementById('email');
    var password = document.getElementById('password');
    var confirm = document.getElementById('confirmPassword');

    document.querySelectorAll('.error-msg').forEach(function(el) { el.textContent = ''; });
    document.querySelectorAll('.form-control').forEach(function(el) { el.classList.remove('is-invalid'); });

    if (username.value.trim().length < 3) {
        document.getElementById('usernameError').textContent = 'Tên đăng nhập phải có ít nhất 3 ký tự.';
        username.classList.add('is-invalid');
        valid = false;
    }
    if (!email.value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
        document.getElementById('emailError').textContent = 'Email không hợp lệ.';
        email.classList.add('is-invalid');
        valid = false;
    }
    if (password.value.length < 6) {
        document.getElementById('passwordError').textContent = 'Mật khẩu phải có ít nhất 6 ký tự.';
        password.classList.add('is-invalid');
        valid = false;
    }
    if (password.value !== confirm.value) {
        document.getElementById('confirmError').textContent = 'Mật khẩu xác nhận không khớp.';
        confirm.classList.add('is-invalid');
        valid = false;
    }
    if (!valid) e.preventDefault();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head><title>Cửa hàng</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h4 class="fw-bold mb-1" style="color:#0f172a;">Cửa hàng</h4>
        <p class="text-muted mb-0">Khám phá tất cả sản phẩm hiện có</p>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/shop}" class="btn btn-sm"
           th:classappend="${selectedCategoryId == null} ? 'btn-sky' : 'btn-outline-sky'">
            Tất cả
        </a>
        <a th:each="cat : ${categories}"
           th:href="@{/shop(category=${cat.id})}"
           class="btn btn-sm"
           th:classappend="${selectedCategoryId != null and selectedCategoryId == cat.id} ? 'btn-sky' : 'btn-outline-sky'"
           th:text="${cat.name}">
        </a>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100">
                <div style="height:200px; background:#f0f9ff; border-radius:12px 12px 0 0; overflow:hidden;"
                     class="d-flex align-items-center justify-content-center">
                    <img th:if="${product.image != null and !product.image.isEmpty()}"
                         th:src="@{'/images/' + ${product.image}}"
                         style="width:100%; height:100%; object-fit:cover;" alt=""/>
                    <i th:unless="${product.image != null and !product.image.isEmpty()}"
                       class="fas fa-image fa-3x" style="color:#cbd5e1;"></i>
                </div>
                <div class="card-body p-3">
                    <span th:if="${product.category != null}"
                          class="badge mb-2"
                          style="background:#e0f2fe; color:#0284c7; font-weight:500; font-size:0.75rem;"
                          th:text="${product.category.name}"></span>
                    <h6 class="fw-semibold mb-2" style="font-size:0.95rem;" th:text="${product.name}"></h6>
                    <p class="fw-bold mb-0" style="color:#0284c7; font-size:1.05rem;"
                       th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' đ'"></p>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(products)}" class="col-12">
            <div class="text-center text-muted py-5">
                <i class="fas fa-search fa-3x mb-3 d-block" style="color:#cbd5e1;"></i>
                <p class="mb-0">Không tìm thấy sản phẩm nào.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>

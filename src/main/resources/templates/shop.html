<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head><title>Cửa hàng</title></head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h4 class="fw-bold mb-1" style="color:#0f172a;">Cửa hàng</h4>
        <p class="text-muted mb-0">Khám phá tất cả sản phẩm hiện có</p>
    </div>


    <form th:action="@{/shop}" method="get" class="mb-4">
        <div class="row gx-2 gy-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="keyword" class="form-control" placeholder="Nhập tên sản phẩm..." th:value="${keyword}">
            </div>
            <div class="col-md-3">
                <select name="category" class="form-select">
                    <option value="">-- Tất cả danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${selectedCategoryId == cat.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="sortField" class="form-select">
                    <option value="id" th:selected="${sortField == null or sortField == 'id'}">Mới nhất</option>
                    <option value="price" th:selected="${sortField == 'price'}">Giá</option>
                </select>
                <input type="hidden" name="sortDir" th:value="${sortDir != null ? sortDir : 'asc'}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Lọc & Tìm</button>
            </div>
        </div>
        <div class="mt-2 text-end">
            <a th:href="@{/shop(keyword=${keyword}, category=${selectedCategoryId}, pageNo=${currentPage}, sortField=${sortField}, sortDir=${reverseSortDir})}" 
               class="btn btn-sm btn-outline-secondary">
               Đổi chiều sắp xếp (<span th:text="${sortDir == 'asc' ? 'Tăng dần' : 'Giảm dần'}"></span>)
            </a>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100">
                <div style="height:200px; background:#f0f9ff; border-radius:12px 12px 0 0; overflow:hidden;"
                     class="d-flex align-items-center justify-content-center">
                    <img th:if="${product.image != null and !product.image.isEmpty()}"
                         th:src="@{'/images/' + ${product.image}}"
                         style="width:100%; height:100%; object-fit:cover;" alt=""/>
                    <i th:unless="${product.image != null and !product.image.isEmpty()}"
                       class="fas fa-image fa-3x" style="color:#cbd5e1;"></i>
                </div>
                <div class="card-body p-3">
                    <span th:if="${product.category != null}"
                          class="badge mb-2"
                          style="background:#e0f2fe; color:#0284c7; font-weight:500; font-size:0.75rem;"
                          th:text="${product.category.name}"></span>
                    <h6 class="fw-semibold mb-2" style="font-size:0.95rem;" th:text="${product.name}"></h6>
                    <p class="fw-bold mb-0" style="color:#0284c7; font-size:1.05rem;"
                       th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + ' đ'"></p>
                    

                    <form th:action="@{/cart/add}" method="post" class="mt-2">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn btn-sm btn-success w-100">
                            <i class="fas fa-shopping-cart"></i> Giỏ hàng
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(products)}" class="col-12">
            <div class="text-center text-muted py-5">
                <i class="fas fa-search fa-3x mb-3 d-block" style="color:#cbd5e1;"></i>
                <p class="mb-0">Không tìm thấy sản phẩm nào.</p>
            </div>
        </div>
    </div>


    <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/shop(keyword=${keyword}, category=${selectedCategoryId}, pageNo=${currentPage - 1}, sortField=${sortField}, sortDir=${sortDir})}">Trước</a>
            </li>
            
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/shop(keyword=${keyword}, category=${selectedCategoryId}, pageNo=${i}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}"></a>
            </li>
            
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/shop(keyword=${keyword}, category=${selectedCategoryId}, pageNo=${currentPage + 1}, sortField=${sortField}, sortDir=${sortDir})}">Tiếp</a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>

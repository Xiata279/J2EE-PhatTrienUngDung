<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sach sach</title>
</head>
<body>
    <h1>Danh sach sach</h1>
    
    <a th:href="@{/books/add}">Them sach moi</a>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tieu de</th>
                <th>Tac gia</th>
                <th>Hanh dong</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td>
                    <a th:href="@{/books/edit/{id}(id=${book.id})}">Sua</a>
                    <a th:href="@{/books/delete/{id}(id=${book.id})}">Xoa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
